# Pipeline GitLab : Terraform provisionne un EC2, un environnement par branche.
#   branche dev  -> environnement dev  (state ec2/dev/terraform.tfstate)
#   branche main -> environnement prod (state ec2/prod/terraform.tfstate)
#
# apply et destroy sont MANUELS (bouton dans l'UI). fmt/validate/plan sont auto.

stages: [validate, plan, deploy, connect, cleanup]

# ---------------------------------------------------------------------------
# UNE seule source de verite pour "branche -> environnement".
# workflow.rules s'evalue UNE fois par pipeline et fait deux choses :
#   1. il limite le pipeline aux branches dev et main (toute autre branche ne
#      declenche AUCUN pipeline) ;
#   2. il definit TF_ENV au niveau PIPELINE -> la variable est visible par TOUS
#      les jobs ET par le mot-cle `environment:` (qui est evalue avant le script).
# Resultat : les jobs ne redefinissent plus rien. Les jobs "auto" n'ont aucune
# regle ; les jobs "manuels" ajoutent seulement `when: manual`.
# ---------------------------------------------------------------------------
workflow:
  rules:
    - if: '$CI_COMMIT_REF_NAME == "main"'
      variables:
        TF_ENV: "prod"
    - if: '$CI_COMMIT_REF_NAME == "dev"'
      variables:
        TF_ENV: "dev"

default:
  image:
    name: hashicorp/terraform:1.13
    entrypoint: [""]

# Base commune (DRY) : on entre dans ops/terraform, on passe la cle publique SSH
# au provider en var Terraform, et on init le backend S3 avec une CLE par env.
.terraform:
  before_script:
    - cd ops/terraform
    - export TF_VAR_ssh_public_key="$SSH_PUBLIC_KEY"
    - terraform init -backend-config="key=ec2/${TF_ENV}/terraform.tfstate"

fmt-validate:
  extends: .terraform
  stage: validate
  script:
    - terraform fmt -check -recursive
    - terraform validate

plan:
  extends: .terraform
  stage: plan
  script:
    - terraform plan -var-file="environments/${TF_ENV}.tfvars"

apply:
  extends: .terraform
  stage: deploy
  when: manual
  environment:
    name: $TF_ENV
    url: $DEPLOY_URL # valeur fournie par le dotenv ci-dessous (deja prefixee http://)
  script:
    - terraform apply -auto-approve -var-file="environments/${TF_ENV}.tfvars"
    - terraform output -raw public_ip
    # Expose l'URL a GitLab (bouton "View deployment" sur l'environnement)
    - echo "DEPLOY_URL=$(terraform output -raw web_url)" > deploy.env
  artifacts:
    reports:
      dotenv: ops/terraform/deploy.env

ssh:
  stage: connect
  when: manual
  # Ce job a besoin de terraform (pour lire l'IP dans le state) ET d'un client SSH.
  before_script:
    - cd ops/terraform
    - apk add --no-cache openssh-client
    - terraform init -backend-config="key=ec2/${TF_ENV}/terraform.tfstate"
  script:
    - IP=$(terraform output -raw public_ip)
    - echo "Connexion SSH a $IP ..."
    # SSH_PRIVATE_KEY est une variable de type "File" -> sa valeur est un CHEMIN
    # vers un fichier temporaire. Ce fichier contient la cle privee encodee en
    # base64 (l'encodage evite les soucis de retours-a-la-ligne dans l'UI GitLab).
    # On la DECODE vers key.pem, puis on pose les bonnes permissions (ssh refuse
    # une cle en 0644).
    - base64 -d "$SSH_PRIVATE_KEY" > key.pem
    - chmod 600 key.pem
    - >
      ssh -i key.pem -o StrictHostKeyChecking=no -o ConnectTimeout=15
      ec2-user@"$IP"
      "echo '--- Connecte a la VM ---'; hostname; uptime; curl -s localhost | head -n1"

destroy:
  extends: .terraform
  stage: cleanup
  when: manual
  environment:
    name: $TF_ENV
    action: stop
  script:
    - terraform destroy -auto-approve -var-file="environments/${TF_ENV}.tfvars"
